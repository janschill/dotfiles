set-option -sa terminal-overrides ",*256col*:Tc"
set-option -sa terminal-overrides ",xterm*:Tc"
# Disable OSC sequences in VS Code terminal to prevent escape sequence display
set-option -sa terminal-overrides ",xterm-256color:Ms="
set -g default-terminal "tmux-256color"
set -g mouse on

# Pass modified keys (Shift+Enter, Ctrl+Enter, ...) through to apps that ask for them
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm-ghostty:extkeys'

# Passthrough CTRL+j for codex new line
bind -n C-j send-keys C-j

# Copy mode: vi keys. Enter with prefix+[, v to select, C-v for block, y to copy, q to leave.
# Mouse drag copies on release without leaving copy mode; double/triple click copies word/line.
setw -g mode-keys vi
set -s copy-command 'pbcopy'
set -g set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X clear-selection

# Trackpad scrolling sends many wheel events; 5 lines each (the default) is too fast
bind -T copy-mode-vi WheelUpPane select-pane \; send -N2 -X scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -N2 -X scroll-down

# Prefix key
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Window navigation
bind -n M-H previous-window
bind -n M-L next-window
bind Space last-window

# Sessions: one per project (see ~/.config/sesh/sesh.toml)
bind -n M-o display-popup -E -w 80% -h 70% "~/.config/tmux/scripts/sesh-picker.sh"
bind o display-popup -E -w 80% -h 70% "~/.config/tmux/scripts/sesh-picker.sh"
bind X confirm-before -p "kill session #S? (y/n)" kill-session
bind -n M-s run-shell "sesh last"
set -g detach-on-destroy off

# Popups in the current pane's directory
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind G display-popup -E -w 95% -h 95% -d "#{pane_current_path}" "gh dash"
bind t display-popup -E -w 80% -h 70% -d "#{pane_current_path}"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Open panes in current dir
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Start index at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Jingle Bells
set -g allow-passthrough on
set -g bell-action any
set -g monitor-bell on
set -g visual-bell off

# Rename windows to path
set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format "#{b:pane_current_path} (#{pane_current_command})"

set -sg escape-time 0

set -g status-right '#(gitmux -cfg $HOME/.config/tmux/gitmux/.gitmux.conf "#{pane_current_path}")'


# Theming
set -g @catppuccin_flavour 'macciato' # or 'latte', 'frappe', 'macchiato'
# Disable terminal color sequences that cause escape codes in VS Code
set -g @catppuccin_no_patched_fonts_theme_enabled on
set -g @catppuccin_directory_text "#{pane_current_path}"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_text "#W"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
# No auto-restore: reboots clear out abandoned sessions (prefix C-r restores manually)
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# Don't jump to bottom after yanking
set -g @yank_action 'copy-pipe-no-clear'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
